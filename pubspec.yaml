name: vokey
description: Offline-first Android voice control and phone finder.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  velocity_x: ^4.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_mobile_ads: ^9.2.0
  firebase_core: ^5.1.0
  firebase_analytics: ^13.0.1
  firebase_crashlytics: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - vokey_privacy_policy.html
    - assets/branding/vokey_icon_1024.png

flutter_launcher_icons:
  android: true
  image_path: assets/branding/vokey_icon_1024.png
  min_sdk_android: 24
  adaptive_icon_background: "#070A1E"
  adaptive_icon_foreground: assets/branding/vokey_icon_1024.png
  adaptive_icon_foreground_inset: 10
