name: Vokey Flutter checks

concurrency:
  group: vokey-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-and-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run Vokey native Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=USE_NEXT_GEN_SDK=true

      - name: Verify debug APK native library alignment
        shell: bash
        run: |
          set -euo pipefail
          LLVM_READELF="$(find "$ANDROID_HOME/ndk" -type f -name llvm-readelf | sort -V | tail -n 1)"
          test -n "$LLVM_READELF"
          python3 scripts/check_16kb_native.py --archive build/app/outputs/flutter-apk/app-debug.apk --readelf "$LLVM_READELF"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          "$ZIPALIGN" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vokey-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Configure production signing and AdMob identifiers
        id: release-signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" || -z "${ANDROID_KEYSTORE_PASSWORD:-}" || -z "${ANDROID_KEY_PASSWORD:-}" || -z "${ANDROID_KEY_ALIAS:-}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Production signing secrets are missing; only a test-signed release build will be produced."
            exit 0
          fi
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/vokey-release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=vokey-release.jks
          EOF
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build installable release-test APK (temporary debug signing)
        if: steps.release-signing.outputs.configured != 'true'
        # Test-signed build for QA: force Google test ad units.
        run: flutter build apk --release --dart-define=USE_NEXT_GEN_SDK=true --dart-define=ADMOB_USE_TEST_IDS=true

      - name: Verify release-test APK native library alignment
        if: steps.release-signing.outputs.configured != 'true'
        shell: bash
        run: |
          set -euo pipefail
          LLVM_READELF="$(find "$ANDROID_HOME/ndk" -type f -name llvm-readelf | sort -V | tail -n 1)"
          test -n "$LLVM_READELF"
          python3 scripts/check_16kb_native.py --archive build/app/outputs/flutter-apk/app-release.apk --readelf "$LLVM_READELF"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          "$ZIPALIGN" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-release.apk

      - name: Verify release-test APK signature
        if: steps.release-signing.outputs.configured != 'true'
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Upload installable release-test APK
        if: steps.release-signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vokey-release-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build universal release APK
        if: steps.release-signing.outputs.configured == 'true'
        run: flutter build apk --release --dart-define=USE_NEXT_GEN_SDK=true

      - name: Build release Android App Bundle
        if: steps.release-signing.outputs.configured == 'true'
        run: flutter build appbundle --release --dart-define=USE_NEXT_GEN_SDK=true

      - name: Verify signed release APK native library alignment
        if: steps.release-signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          LLVM_READELF="$(find "$ANDROID_HOME/ndk" -type f -name llvm-readelf | sort -V | tail -n 1)"
          test -n "$LLVM_READELF"
          python3 scripts/check_16kb_native.py --archive build/app/outputs/flutter-apk/app-release.apk --readelf "$LLVM_READELF"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          "$ZIPALIGN" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-release.apk

      - name: Verify signed release AAB native library alignment
        if: steps.release-signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          LLVM_READELF="$(find "$ANDROID_HOME/ndk" -type f -name llvm-readelf | sort -V | tail -n 1)"
          test -n "$LLVM_READELF"
          python3 scripts/check_16kb_native.py --archive build/app/outputs/bundle/release/app-release.aab --readelf "$LLVM_READELF"

      - name: Verify release APK signature
        if: steps.release-signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Upload signed release APK
        if: steps.release-signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vokey-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release AAB
        if: steps.release-signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vokey-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Guard against the R8 startup crash regression
        shell: bash
        run: |
          set -euo pipefail
          # WorkManager (via play-services-ads) builds WorkDatabase_Impl reflectively
          # at process start. If R8 strips its constructor every release build crashes
          # before Flutter runs. See android/app/proguard-rules.pro.
          if awk '/^androidx.work.impl.WorkDatabase_Impl:/{p=1;next} /^[^ ]/{p=0} p' \
              build/app/outputs/mapping/release/usage.txt | grep -q '<init>()'; then
            echo "::error::R8 removed WorkDatabase_Impl.<init>() - release build would crash on launch"
            exit 1
          fi

      - name: Verify release APK application ID
        shell: bash
        run: |
          set -euo pipefail
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          PKG="$("$AAPT2" dump packagename build/app/outputs/flutter-apk/app-release.apk)"
          echo "package=$PKG"
          test "$PKG" = "com.dev.vokey"

      - name: Enable KVM for the emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator launch smoke test (release APK)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/launch_smoke_test.sh build/app/outputs/flutter-apk/app-release.apk
